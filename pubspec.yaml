name: easy_bible_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.4+24

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  table_calendar: ^3.2.1
  marquee: ^2.3.0
  fading_edge_scrollview: ^4.1.1
  google_mobile_ads: ^9.1.0
  google_fonts: ^8.2.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  firebase_core: ^4.14.0
  firebase_remote_config: ^6.6.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  lottie: ^3.5.1
  screenshot: ^3.0.0
  path_provider: ^2.1.6
  share_plus: ^13.0.0
  permission_handler: ^13.0.2
  gal: ^2.3.3
  app_tracking_transparency: ^2.0.7
  carousel_slider: ^5.1.2
  toastification: ^3.2.0

  # 정기구독(인앱결제) - 프리미엄 기능 잠금 해제용
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3

# shared_preferences 2.5.5가 여전히 낡은 Kotlin(2.1.10)을 자체 buildscript에 박아둔
# shared_preferences_android 2.4.10에 묶여 있어, 더 최신 버전으로 강제 override합니다.
dependency_overrides:
  shared_preferences_android: ^2.4.28

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  
  # 안드로이드 adaptive icon (선택사항)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  # 라이트 모드
  color: "#FAF9F6"  # LightColors.background
  image: assets/splash/splash_icon.png
  
  # 다크 모드
  color_dark: "#121212"  # DarkColors.background
  image_dark: assets/splash/splash_icon.png
  
  # Android 12+ 지원
  android_12:
    color: "#FAF9F6"
    image: assets/splash/splash_icon.png
    color_dark: "#121212"
    image_dark: assets/splash/splash_icon.png
    fullscreen: true  # 이거 꼭 추가
  
  # 플랫폼 설정
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/bible.json
    - assets/bible_kjv.json
    - assets/bible_snb.json
    - assets/bible_subtitles.json
    - assets/bible_subtitles_snb.json
    - assets/icon/app_icon.png
    - assets/icon/bible_icon.png
    - assets/splash/splash_icon.png
    - assets/lottie/
    - assets/quiz/question_ox_easy.json
    - assets/quiz/question_ox_medium.json
    - assets/quiz/question_ox_hard.json
    - assets/quiz/question_multiple_easy.json
    - assets/quiz/question_multiple_medium.json
    - assets/quiz/question_multiple_hard.json

  fonts:
    - family: ChosunCentennial
      fonts:
        - asset: assets/fonts/ChosunCentennial_ttf.ttf
          weight: 400

    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900