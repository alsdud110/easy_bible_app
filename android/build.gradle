// AGP/Kotlin Gradle Plugin 버전은 settings.gradle의 pluginManagement.plugins 블록에서
// 관리합니다. 여기서 buildscript classpath로 다시 선언하면 두 버전이 충돌해
// AGP가 감지하는 실제 Kotlin 버전이 어긋나는 문제가 생길 수 있어 제거했습니다.
ext.kotlin_version = '2.2.20'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    // 이 부분이 핵심입니다: 모든 라이브러리의 코틀린 버전을 프로젝트 버전과 강제로 일치시킵니다.
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                // 플러그인이 자기 ext.kotlin_version(예: 1.7.10)을 갖고 있어도 루트 버전으로 고정
                details.useVersion rootProject.ext.kotlin_version
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}